<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#0b0b1f"/>

  <!-- Ground -->
  <rect y="175" width="400" height="5" fill="#16163a"/>

  <!-- Glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0b1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="100" r="120" fill="url(#glow)" />

  <!-- Robot -->
  <g id="robot" transform="translate(40,150)">
    <!-- Body -->
    <rect x="-10" y="-45" width="20" height="35" rx="6" ry="6"
      fill="#8afcff" stroke="#00ffff" stroke-width="0.5"/>

    <!-- Head -->
    <rect x="-13" y="-70" width="26" height="25" rx="8" ry="8"
      fill="#a4fdff" stroke="#00ffff" stroke-width="0.5"/>
    <circle cx="-5" cy="-58" r="3" fill="#00ffff"/>
    <circle cx="5" cy="-58" r="3" fill="#00ffff"/>

    <!-- LEFT ARM (fixed) -->
    <rect x="-18" y="-40" width="8" height="25" rx="3" ry="3"
      fill="#6ee7ff"/>

    <!-- RIGHT ARM (fixed) -->
    <rect x="10" y="-40" width="8" height="25" rx="3" ry="3"
      fill="#6ee7ff"/>

    <!-- LEFT LEG -->
    <g transform="translate(-6,-10)">
      <rect x="-4" y="0" width="8" height="15" rx="3" ry="3"
        fill="#7ef9ff">
        <animateTransform attributeName="transform" type="rotate"
          values="25;-20;25" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="-4" y="15" width="8" height="13" rx="3" ry="3"
        fill="#5de5ff">
        <animateTransform attributeName="transform" type="rotate"
          values="10;-10;10" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- RIGHT LEG -->
    <g transform="translate(6,-10)">
      <rect x="-4" y="0" width="8" height="15" rx="3" ry="3"
        fill="#7ef9ff">
        <animateTransform attributeName="transform" type="rotate"
          values="-20;25;-20" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="-4" y="15" width="8" height="13" rx="3" ry="3"
        fill="#5de5ff">
        <animateTransform attributeName="transform" type="rotate"
          values="-10;10;-10" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Walking motion -->
    <animateTransform attributeName="transform" type="translate"
      values="40,150;360,150;40,150" dur="10s" repeatCount="indefinite"/>
  </g>
</svg>
